packages:
  - apps/*
  - packages/*

# Hanya paket yang sudah direview yang boleh menjalankan install script (security.md §12).
allowBuilds:
  esbuild: true
  unrs-resolver: false

# Satu versi happy-dom di seluruh workspace (peer opsional vitest), yang lolos minimumReleaseAge.
# @nuxt/devtools 3.4.3 masih di dalam range `nuxt` (^3.4.1) dan sudah melepas dependency
# `simple-git` + `@simple-git/argv-parser`, yang membawa 2 critical + 2 high (QA #30 / MAYOR-3):
# GHSA-x6jw-m9v5-85vh, GHSA-v5rq-49vh-5v5c, GHSA-g4wm-2vf7-vfgr, GHSA-858h-whjf-mvg5.
# Kit & wizard ikut dipin karena dirilis in-lockstep dengan devtools (hindari dua versi terpasang).
# `simple-git`/`@simple-git/argv-parser` tetap di-override walau saat ini tidak ada di graf:
# kalau devtools (atau paket lain) memasangnya lagi, versi rentan tidak bisa masuk diam-diam.
# 4.0.2 = versi patched untuk GHSA-x6jw (butuh >=4.0.1) dan GHSA-v5rq (argv-parser >=2.0.1).
overrides:
  happy-dom: 20.14.5
  '@nuxt/devtools': 3.4.3
  '@nuxt/devtools-kit': 3.4.3
  '@nuxt/devtools-wizard': 3.4.3
  simple-git: 4.0.2
  '@simple-git/argv-parser': 2.0.1

# Satu-satunya advisory yang tidak bisa ditutup: GHSA-86w9-cpqp-85rv (node-forge, high).
# `first_patched_version = null` di GitHub advisory API - rilis upstream terakhir 1.4.0,
# belum ada 1.4.1 (dicek 2026-10-23). Jalur: listhen <- @nuxt/cli / nitropack, dipakai untuk
# self-signed HTTPS server saat dev. Tidak ikut bundle produksi: `.output/server` tidak memuat
# node-forge/listhen, dan devtools mati di `$production` (apps/web/nuxt.config.ts).
# Mitigasi: kode ini tidak memverifikasi sertifikat/tanda tangan RSA dari input user; kalau
# nanti butuh verifikasi tanda tangan PKCS#1 v1.5 di server, jangan pakai node-forge.
# Ini BUKAN mematikan audit: advisory lain tetap memblokir. Cabut entri begitu 1.4.1 terbit
# (cek: pnpm audit --json | jq '.advisories').
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
