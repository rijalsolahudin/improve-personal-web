plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'id.stackinnov.improvepersonal'
version = '0.1.0'

android {
  namespace "id.stackinnov.improvepersonal.sodium"
  // Pin NDK = scripts/libsodium.lock (ANDROID_NDK_VERSION): libsodium.a dan lem JNI wajib dari
  // toolchain yang sama.
  ndkVersion "27.1.12297006"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    ndk {
      abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1"
    }
  }

  sourceSets {
    // Vektor yang SAMA dengan Jest & uji host - satu sumber kebenaran untuk kesamaan byte.
    androidTest.assets.srcDirs += ['../test-vectors']
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'

  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
