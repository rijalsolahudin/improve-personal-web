<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F6EBDA" />
    <!-- Halaman sementara: jangan diindeks. -->
    <meta name="robots" content="noindex" />
    <title>Kamu sedang offline · Improve Personal</title>
    <style>
      /*
       * Halaman ini SENGAJA berkas HTML statis (bukan `app/pages/offline.vue`).
       * Alasannya: service worker menyajikannya untuk URL yang gagal dibuka (mis. `/login`), dan
       * kalau yang dikirim HTML hasil render Nuxt, hidrasi Nuxt mengambil alih route sesuai URL di
       * address bar - halaman offline-nya langsung tertimpa halaman yang sebenarnya gagal dimuat.
       * Berkas statis tanpa skrip tidak bisa tertimpa.
       *
       * Konsekuensinya: berkas ini di luar pipeline Nuxt, jadi tidak bisa memakai CSS hasil build
       * maupun `var(--...)` runtime. Nilai di bawah disalin dari `@improve-personal/tokens` (tema
       * Kuning, `themes.kuning`) - kalau token berubah, salin ulang ke sini. Tanpa JS: CSP hanya
       * mengizinkan skrip ber-nonce, dan berkas statis tidak pernah mendapat nonce.
       */
      :root {
        --bg: #f6ebda;
        --grid: rgba(214, 180, 140, 0.22);
        --paper: #fffbf4;
        --ink: #2f2a24;
        --ink-2: #5e5040;
        --deep: #8a5a12;
        --primary: #f3cb86;
        --radius-panel: 32px;
        --shadow-drop-sm: 0 5px 0 rgba(47, 42, 36, 0.1);
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: clamp(16px, 4vw, 40px);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg);
        background-image: radial-gradient(var(--grid) 1px, transparent 1px);
        background-size: 18px 18px;
        color: var(--ink);
        font-family:
          ui-rounded,
          'Nunito',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-size: 15px;
        line-height: 1.25;
      }

      .card {
        width: 100%;
        max-width: 520px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding: clamp(24px, 5vw, 40px);
        background: var(--paper);
        border: 2px solid var(--ink);
        border-radius: var(--radius-panel);
        box-shadow: var(--shadow-drop-sm);
      }

      .mark {
        display: block;
      }

      .eyebrow {
        margin: 0;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--deep);
      }

      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        line-height: 1.15;
        color: var(--ink);
      }

      .body {
        margin: 0;
        color: var(--ink-2);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        padding: 12px 20px;
        border: 2px solid var(--ink);
        border-radius: 14px;
        background: var(--primary);
        box-shadow: 0 3px 0 rgba(47, 42, 36, 0.18);
        color: var(--ink);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .link {
        color: var(--ink-2);
        font-size: 14px;
        font-weight: 800;
        text-underline-offset: 3px;
      }

      .btn:focus-visible,
      .link:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: no-preference) {
        .btn {
          transition: transform 120ms ease;
        }

        .btn:active {
          transform: translateY(2px);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg
        class="mark"
        width="44"
        height="44"
        viewBox="0 0 64 64"
        role="img"
        aria-label="Improve Personal"
      >
        <rect width="64" height="64" rx="14" fill="#F3CB86" />
        <rect
          x="14"
          y="15"
          width="36"
          height="34"
          rx="5"
          fill="#FFFBF4"
          stroke="#2F2A24"
          stroke-width="2.5"
        />
        <rect
          x="19"
          y="21"
          width="5"
          height="5"
          rx="1.2"
          fill="#F3CB86"
          stroke="#2F2A24"
          stroke-width="1.2"
        />
        <path
          d="M20 23.5l1.4 1.4 2.2-2.6"
          fill="none"
          stroke="#2F2A24"
          stroke-width="1.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <rect x="27" y="22" width="18" height="2.4" rx="1.2" fill="#2F2A24" />
        <rect
          x="19"
          y="30"
          width="5"
          height="5"
          rx="1.2"
          fill="#F3CB86"
          stroke="#2F2A24"
          stroke-width="1.2"
        />
        <path
          d="M20 32.5l1.4 1.4 2.2-2.6"
          fill="none"
          stroke="#2F2A24"
          stroke-width="1.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <rect x="27" y="31" width="14" height="2.4" rx="1.2" fill="#2F2A24" />
        <rect
          x="19"
          y="39"
          width="5"
          height="5"
          rx="1.2"
          fill="#FFFBF4"
          stroke="#2F2A24"
          stroke-width="1.2"
        />
        <rect x="27" y="40" width="18" height="2.4" rx="1.2" fill="#2F2A24" />
      </svg>
      <p class="eyebrow">Offline</p>
      <h1>Kamu sedang offline</h1>
      <p class="body">
        Halaman ini butuh koneksi. Catatanmu aman di perangkat ini - buka aplikasi untuk lanjut
        bekerja, dan sinkronisasi jalan lagi begitu internet kembali.
      </p>
      <div class="actions">
        <!-- `href=""` = muat ulang URL yang sedang dibuka; begitu jaringan kembali, halaman asli
             yang tampil. Tanpa JS supaya tidak diblokir CSP. -->
        <a class="btn" href="">Coba lagi</a>
        <a class="link" href="/app">Buka aplikasi</a>
      </div>
    </main>
  </body>
</html>
