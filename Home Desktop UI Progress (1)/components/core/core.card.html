<!-- @dsCard group="Components" viewport="700x400" name="Core controls" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body);color:var(--ink);font-weight:700}.l{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mute-3);margin:0 0 8px}</style>
<script src="../_preview.js"></script></head><body><div id="root"></div>
<script type="text/x-card">
const Row = ({ children, gap = 10, align = 'center' }) => <div style={{ display: 'flex', gap, flexWrap: 'wrap', alignItems: align, marginBottom: 16 }}>{children}</div>;
const L = ({ children }) => <div className="l">{children}</div>;
function App() {

  const [seg, setSeg] = React.useState('task'); const [ck, setCk] = React.useState(true); const [tg, setTg] = React.useState(true); const [f, setF] = React.useState('semua');
  return <div>
    <L>BUTTON</L>
    <Row><Button>Simpan</Button><Button variant="outline">Hari ini</Button><Button variant="dashed">+ Tambah jadwal</Button><Button variant="ghost">Semua</Button><Button disabled>Simpan</Button><Button size="lg" chunky>Mulai fokus</Button></Row>
    <L>ICON BUTTON · CHECKBOX · TOGGLE · PRIORITY</L>
    <Row><IconButton>‹</IconButton><IconButton size={52}>↺</IconButton><IconButton tone="bell"><div style={{width:15,height:17,border:'2.5px solid var(--ink)',borderRadius:'8px 8px 3px 3px',boxSizing:'border-box'}} /></IconButton>
      <Checkbox checked={ck} onChange={setCk} /><Checkbox /><Checkbox size={22} color="var(--cat-karier)" checked /><Toggle on={tg} onChange={setTg} />
      <PriorityBadge level="urgent" /><PriorityBadge level="medium" /><PriorityBadge level="low" /></Row>
    <L>CHIP · SEGMENTED</L>
    <Row gap={6}>{[['semua','Semua 6'],['hari','Hari ini 2'],['telat','Terlambat 1']].map(([k,l]) => <Chip key={k} active={f===k} onClick={() => setF(k)}>{l}</Chip>)}<Chip variant="soft" active>Modul 4 — VPC</Chip><Chip variant="soft">Bayar tagihan</Chip></Row>
    <Segmented value={seg} onChange={setSeg} options={[{value:'task',label:'Task'},{value:'event',label:'Jadwal'},{value:'habit',label:'Habit'}]} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>dsPreview(["Button.jsx","IconButton.jsx","Chip.jsx","Segmented.jsx","Checkbox.jsx","Toggle.jsx","PriorityBadge.jsx"]);</script></body></html>
