<!-- @dsCard group="Components" viewport="700x380" name="Journal" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body);color:var(--ink);font-weight:700}.l{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mute-3);margin:0 0 8px}</style>
<script src="../_preview.js"></script></head><body><div id="root"></div>
<script type="text/x-card">
const Row = ({ children, gap = 10, align = 'center' }) => <div style={{ display: 'flex', gap, flexWrap: 'wrap', alignItems: align, marginBottom: 16 }}>{children}</div>;
const L = ({ children }) => <div className="l">{children}</div>;
function App() {

  const [m, setM] = React.useState(3); const [t, setT] = React.useState('Hari ini akhirnya paham VPC.\nBesok lanjut security group.');
  return <section style={{ position: 'relative', background: 'var(--paper-2)', border: '3px solid var(--ink)', borderRadius: 26, boxShadow: 'var(--shadow-drop-sm)', padding: '18px 0 14px', marginTop: 10, maxWidth: 460 }}>
    <Tape />
    <div style={{ padding: '0 16px' }}>
      <div style={{ fontFamily: 'var(--font-hand)', fontSize: 22 }}>Memo hari ini</div>
      <div style={{ fontWeight: 800, fontSize: 11, letterSpacing: '.08em', color: 'var(--mute-2)', margin: '10px 0 8px' }}>HARI INI RASANYA…</div>
      <MoodPicker value={m} onChange={setM} />
    </div>
    <div style={{ marginTop: 12, borderTop: '2px dashed var(--mline)' }} />
    <MemoPaper value={t} onChange={e => setT(e.target.value)} minHeight={120} />
  </section>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>dsPreview(["MemoPaper.jsx","Tape.jsx","MoodPicker.jsx"]);</script></body></html>
