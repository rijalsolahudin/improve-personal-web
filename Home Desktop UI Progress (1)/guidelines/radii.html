<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-body);color:var(--ink);background:var(--bg);font-weight:700;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}.lab{font-size:11px;font-weight:800;color:var(--mute);margin-top:6px;line-height:1.3}
.sw{width:84px}.sw b{display:block;height:52px;border-radius:14px;border:2px solid rgba(47,42,36,.12)}
code{font-family:ui-monospace,monospace;font-size:10px;color:var(--mute-2);font-weight:500}
</style></head><body><div class="row" style="align-items:flex-end;gap:14px"><div style="text-align:center"><div style="width:90px;height:44px;border-radius:var(--radius-pill);background:var(--soft);border:2.5px solid var(--ink)"></div><div class="lab">pill</div></div><div style="text-align:center"><div style="width:70px;height:70px;border-radius:var(--radius-panel);background:var(--soft);border:2.5px solid var(--ink)"></div><div class="lab">32</div></div><div style="text-align:center"><div style="width:70px;height:70px;border-radius:var(--radius-hero);background:var(--soft);border:2.5px solid var(--ink)"></div><div class="lab">24</div></div><div style="text-align:center"><div style="width:70px;height:70px;border-radius:var(--radius-card);background:var(--soft);border:2.5px solid var(--ink)"></div><div class="lab">22</div></div><div style="text-align:center"><div style="width:70px;height:70px;border-radius:var(--radius-row);background:var(--soft);border:2.5px solid var(--ink)"></div><div class="lab">18</div></div><div style="text-align:center"><div style="width:52px;height:52px;border-radius:var(--radius-btn-sq);background:var(--soft);border:2.5px solid var(--ink)"></div><div class="lab">16</div></div><div style="text-align:center"><div style="width:30px;height:30px;border-radius:var(--radius-check);background:var(--soft);border:2.5px solid var(--ink)"></div><div class="lab">9</div></div><div style="text-align:center"><div style="width:56px;height:56px;border-radius:var(--radius-leaf);background:var(--soft);border:2.5px solid var(--ink)"></div><div class="lab">leaf</div></div><div style="text-align:center"><div style="width:70px;height:70px;border-radius:var(--radius-leaf-lg);background:var(--soft);border:2.5px solid var(--ink)"></div><div class="lab">leaf lg</div></div></div></body></html>
