<!-- @dsCard group="Shape" viewport="700x170" name="Borders & shadows" subtitle="Ink outlines + hard, unblurred drop shadows" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-body);color:var(--ink);background:var(--bg);font-weight:700;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}.lab{font-size:11px;font-weight:800;color:var(--mute);margin-top:6px;line-height:1.3}
.sw{width:84px}.sw b{display:block;height:52px;border-radius:14px;border:2px solid rgba(47,42,36,.12)}
code{font-family:ui-monospace,monospace;font-size:10px;color:var(--mute-2);font-weight:500}
</style></head><body><div class="row" style="gap:18px;align-items:flex-start">
<div><div style="width:110px;height:64px;border-radius:22px;background:var(--paper);border:2px solid var(--line)"></div><div class="lab">2px line<br><code>soft card</code></div></div>
<div><div style="width:110px;height:64px;border-radius:22px;background:var(--paper);border:2.5px solid var(--ink)"></div><div class="lab">2.5px ink<br><code>controls</code></div></div>
<div><div style="width:110px;height:64px;border-radius:26px;background:var(--paper-2);border:3px solid var(--ink);box-shadow:var(--shadow-drop)"></div><div class="lab">3px + drop<br><code>--shadow-drop</code></div></div>
<div><div style="width:64px;height:64px;border-radius:22px 22px 22px 8px;background:var(--accent);border:3px solid var(--ink);box-shadow:var(--shadow-press)"></div><div class="lab">FAB<br><code>--shadow-press</code></div></div>
<div><div style="width:44px;height:44px;border-radius:15px 15px 15px 5px;background:var(--icon-todo);box-shadow:var(--shadow-icon-inset)"></div><div class="lab">icon<br><code>inset</code></div></div></div></body></html>
