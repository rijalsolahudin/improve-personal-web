<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./sticker-lib.js"></script>
</helmet>
<div title="{{ name }}" style="width:{{ px }};height:{{ px }};position:relative;flex-shrink:0;filter:{{ filter }};box-sizing:border-box;border-radius:{{ radius }};background:{{ tileBg }};border:{{ tileBorder }};box-shadow:{{ tileShadow }};display:flex;align-items:center;justify-content:center">
  <sc-if value="{{ isM }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Mascot" animal="{{ m }}" size="{{ mSize }}" hint-size="48px,48px"></dc-import>
  </sc-if>
  <sc-if value="{{ isE }}" hint-placeholder-val="{{ false }}">
    <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:{{ fs }};line-height:1;user-select:none">{{ e }}</div>
  </sc-if>
  <sc-if value="{{ isUnknown }}" hint-placeholder-val="{{ false }}">
    <div style="width:100%;height:100%;box-sizing:border-box;border:2.5px dashed #C9B89E;border-radius:28%;background:#FBF3E6;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:{{ ph }};color:#A8957C">?</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;sid&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hewan/kelinci&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:96,&quot;tsType&quot;:&quot;number&quot;},&quot;cut&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    if (!window.IP_STICKERS) this.iv = setInterval(() => { if (window.IP_STICKERS) { clearInterval(this.iv); this.forceUpdate(); } }, 100);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const raw = String(this.props.sid || ''), icon = /^icon:/.test(raw), sid = raw.replace(/^icon:/, ''), size = Number(this.props.size) || 48, L = window.IP_STICKERS;
    let it = null;
    if (sid.startsWith('emoji:')) it = { e: sid.slice(6), name: sid.slice(6) };
    else if (L) it = L.byId[sid] || null;
    const loading = !L && !sid.startsWith('emoji:');
    const w = Math.max(1.5, size / 36);
    return {
      px: size + 'px', size, name: it ? it.name : 'Sticker tidak dikenal',
      isM: !!(it && it.m), isE: !!(it && it.e), isUnknown: !it && !loading, m: it && it.m, e: it && it.e,
      fs: Math.round(size * (icon ? 0.54 : 0.8)) + 'px', mSize: icon ? Math.round(size * 0.7) : size,
      radius: icon ? Math.round(size * 0.3) + 'px' : '0', tileBg: icon ? ((L && L.tint && it && L.tint[it.pack]) || '#F2E4CC') : 'transparent',
      tileBorder: icon ? Math.max(1.5, size / 30).toFixed(1) + 'px solid #2F2A24' : 'none', tileShadow: icon ? '0 ' + Math.max(2, Math.round(size / 20)) + 'px 0 rgba(47,42,36,.18)' : 'none', ph: Math.round(size * 0.42) + 'px',
      filter: this.props.cut && !icon ? `drop-shadow(${w}px 0 0 #FFFBF4) drop-shadow(-${w}px 0 0 #FFFBF4) drop-shadow(0 ${w}px 0 #FFFBF4) drop-shadow(0 -${w}px 0 #FFFBF4) drop-shadow(0 3px 0 rgba(47,42,36,.18))` : 'none',
    };
  }
}
</script>
</body>
</html>
