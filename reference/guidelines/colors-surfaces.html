<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces & lines" subtitle="Warm paper stack, from page to card" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-body);color:var(--ink);background:var(--bg);font-weight:700;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}.lab{font-size:11px;font-weight:800;color:var(--mute);margin-top:6px;line-height:1.3}
.sw{width:84px}.sw b{display:block;height:52px;border-radius:14px;border:2px solid rgba(47,42,36,.12)}
code{font-family:ui-monospace,monospace;font-size:10px;color:var(--mute-2);font-weight:500}
</style></head><body><div class="row"><div class="sw"><b style="background:var(--bg)"></b><div class="lab">Page<br><code>--bg</code></div></div><div class="sw"><b style="background:var(--paper)"></b><div class="lab">Paper<br><code>--paper</code></div></div><div class="sw"><b style="background:var(--paper-2)"></b><div class="lab">Paper 2<br><code>--paper-2</code></div></div><div class="sw"><b style="background:var(--alt)"></b><div class="lab">Inset<br><code>--alt</code></div></div><div class="sw"><b style="background:var(--chip)"></b><div class="lab">Track<br><code>--chip</code></div></div><div class="sw"><b style="background:var(--hover)"></b><div class="lab">Hover<br><code>--hover</code></div></div><div class="sw"><b style="background:var(--line)"></b><div class="lab">Line<br><code>--line</code></div></div><div class="sw"><b style="background:var(--dash)"></b><div class="lab">Dash<br><code>--dash</code></div></div></div></body></html>
