<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-body);color:var(--ink);background:var(--bg);font-weight:700;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}.lab{font-size:11px;font-weight:800;color:var(--mute);margin-top:6px;line-height:1.3}
.sw{width:84px}.sw b{display:block;height:52px;border-radius:14px;border:2px solid rgba(47,42,36,.12)}
code{font-family:ui-monospace,monospace;font-size:10px;color:var(--mute-2);font-weight:500}
</style></head><body><div class="row" style="gap:14px">
<div style="flex:1;height:130px;border-radius:22px;background-color:var(--bg);background-image:var(--pattern-grid);background-size:24px 24px;border:2px solid var(--line)"></div>
<div style="flex:1;height:130px;border-radius:22px;background-color:var(--primary);background-image:var(--pattern-dots);background-size:18px 18px"></div>
<div style="flex:1;height:130px;border-radius:22px;background-color:#FFFDF6;background-position:0 6px;border:2.5px solid var(--ink)" data-ruled></div></div>
<div class="row" style="gap:14px"><div class="lab" style="flex:1">Page — graph paper</div><div class="lab" style="flex:1">Hero — dot grid</div><div class="lab" style="flex:1">Memo — ruled + margin</div></div></body></html>
