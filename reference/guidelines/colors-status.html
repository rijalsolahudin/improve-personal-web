<!-- @dsCard group="Colors" viewport="700x140" name="Priority & status" subtitle="Priority pills, success, overdue, notify" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-body);color:var(--ink);background:var(--bg);font-weight:700;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}.lab{font-size:11px;font-weight:800;color:var(--mute);margin-top:6px;line-height:1.3}
.sw{width:84px}.sw b{display:block;height:52px;border-radius:14px;border:2px solid rgba(47,42,36,.12)}
code{font-family:ui-monospace,monospace;font-size:10px;color:var(--mute-2);font-weight:500}
</style></head><body><div class="row" style="align-items:center;gap:14px"><span style="font-weight:800;font-size:13px;padding:3px 12px;border-radius:999px;background:var(--prio-urgent-bg);color:var(--prio-urgent-fg)">Urgent</span><span style="font-weight:800;font-size:13px;padding:3px 12px;border-radius:999px;background:var(--prio-medium-bg);color:var(--prio-medium-fg)">Medium</span><span style="font-weight:800;font-size:13px;padding:3px 12px;border-radius:999px;background:var(--prio-low-bg);color:var(--prio-low-fg)">Low</span>
<div class="sw"><b style="background:var(--success)"></b><div class="lab">Selesai<br><code>--success</code></div></div><div class="sw"><b style="background:var(--danger)"></b><div class="lab">Terlambat<br><code>--danger</code></div></div><div class="sw"><b style="background:var(--notify)"></b><div class="lab">Notif dot<br><code>--notify</code></div></div><div class="sw"><b style="background:var(--streak)"></b><div class="lab">Streak<br><code>--streak</code></div></div></div></body></html>
