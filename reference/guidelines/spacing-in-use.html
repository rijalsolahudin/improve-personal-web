<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing in use" subtitle="Mobile stack: 16 gutter, 10 grid gap, 12 card pad" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-body);color:var(--ink);background:var(--bg);font-weight:700;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}.lab{font-size:11px;font-weight:800;color:var(--mute);margin-top:6px;line-height:1.3}
.sw{width:84px}.sw b{display:block;height:52px;border-radius:14px;border:2px solid rgba(47,42,36,.12)}
code{font-family:ui-monospace,monospace;font-size:10px;color:var(--mute-2);font-weight:500}
</style></head><body><div style="width:300px;background:var(--bg);background-image:var(--pattern-grid);background-size:24px 24px;padding:16px;border-radius:18px;border:2px dashed var(--dash-2);display:flex;flex-direction:column;gap:16px;box-sizing:border-box">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div style="background:var(--soft);border-radius:22px;padding:12px;height:36px;outline:1px dashed var(--accent);outline-offset:-12px"></div><div style="background:var(--paper);border-radius:22px;padding:12px;height:36px;outline:1px dashed var(--accent);outline-offset:-12px"></div><div style="background:var(--primary);border-radius:22px;padding:12px;height:36px;outline:1px dashed var(--accent);outline-offset:-12px"></div></div>
<div style="background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:16px;font-size:11px;color:var(--mute)">16 pad · 6 row gap</div></div></body></html>
