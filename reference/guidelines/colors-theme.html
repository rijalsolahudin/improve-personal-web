<!-- @dsCard group="Colors" viewport="700x170" name="Theme core" subtitle="Kuning default — primary, soft, accent, deep" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-body);color:var(--ink);background:var(--bg);font-weight:700;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}.lab{font-size:11px;font-weight:800;color:var(--mute);margin-top:6px;line-height:1.3}
.sw{width:84px}.sw b{display:block;height:52px;border-radius:14px;border:2px solid rgba(47,42,36,.12)}
code{font-family:ui-monospace,monospace;font-size:10px;color:var(--mute-2);font-weight:500}
</style></head><body><div class="row"><div class="sw"><b style="background:var(--primary)"></b><div class="lab">Primary<br><code>--primary</code></div></div><div class="sw"><b style="background:var(--soft)"></b><div class="lab">Soft<br><code>--soft</code></div></div><div class="sw"><b style="background:var(--accent)"></b><div class="lab">Accent<br><code>--accent</code></div></div><div class="sw"><b style="background:var(--deep)"></b><div class="lab">Deep<br><code>--deep</code></div></div><div class="sw"><b style="background:var(--deeper)"></b><div class="lab">Deeper<br><code>--deeper</code></div></div><div class="sw"><b style="background:var(--bell)"></b><div class="lab">Bell<br><code>--bell</code></div></div><div class="sw"><b style="background:var(--ink)"></b><div class="lab">Ink<br><code>--ink</code></div></div></div></body></html>
