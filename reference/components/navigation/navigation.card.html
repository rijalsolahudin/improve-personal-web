<!-- @dsCard group="Components" viewport="700x400" name="Navigation" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body);color:var(--ink);font-weight:700}.l{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mute-3);margin:0 0 8px}</style>
<script src="../_preview.js"></script></head><body><div id="root"></div>
<script type="text/x-card">
const Row = ({ children, gap = 10, align = 'center' }) => <div style={{ display: 'flex', gap, flexWrap: 'wrap', alignItems: align, marginBottom: 16 }}>{children}</div>;
const L = ({ children }) => <div className="l">{children}</div>;
function App() {

  const [a, setA] = React.useState('home'); const [open, setOpen] = React.useState(true);
  const tabs = [{key:'home',label:'Home',glyph:'⌂',color:'#E6A800'},{key:'cal',label:'Kalender',glyph:'30',color:'#F9D857'},{key:'todo',label:'To-do',glyph:'✓',color:'#9B4FC9'},{key:'more',label:'Lainnya',glyph:'⋯',color:'#10A8D8'}];
  return <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
    <div style={{ width: 210, background: 'var(--paper)', border: '3px solid var(--ink)', borderRadius: 32, padding: 12, boxShadow: 'var(--shadow-drop)', display: 'flex', flexDirection: 'column', gap: 2 }}>
      {[['⌂','--icon-home','Home'],['30','--icon-cal','Kalender'],['✓','--icon-todo','To-do'],['◎','--icon-goals','Goals']].map(([g,c,l]) => <NavItem key={l} glyph={g} color={'var(' + c + ')'} label={l} active={l === 'Home'} />)}
    </div>
    <div style={{ flex: 1, position: 'relative', height: 340, borderRadius: 26, overflow: 'hidden', background: 'var(--bg)', backgroundImage: 'var(--pattern-grid)', backgroundSize: '24px 24px', border: '2px solid var(--line)' }}>
      <div style={{ position: 'absolute', left: 12, right: 12, bottom: 16 }}><TabBar items={tabs} active={a} onChange={setA} onAdd={() => setOpen(true)} /></div>
      <Sheet open={open} onClose={() => setOpen(false)} title="Tambah cepat"><div style={{ fontSize: 14, color: 'var(--mute)' }}>Ketuk area gelap buat nutup.</div></Sheet>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>dsPreview(["../display/AppIcon.jsx","NavItem.jsx","TabBar.jsx","Sheet.jsx"]);</script></body></html>
